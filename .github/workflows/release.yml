name: Release

# Tag push publishes all-platform artifacts; workflow_dispatch packages a branch without
# creating a Release.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write   # gh release create
  packages: write   # push ghcr.io image

jobs:
  # Version is resolved once here and shared by all three artifacts, so no platform can
  # disagree about what it built.
  identity:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.id.outputs.version }}
      commit: ${{ steps.id.outputs.commit }}
      build_time: ${{ steps.id.outputs.build_time }}
      image: ${{ steps.id.outputs.image }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: id
        name: Resolve version
        run: |
          set -euo pipefail
          # web/package.json is the single source of truth (same as scripts/build-local-test.ps1);
          # a v* tag wins over it.
          base="$(sed -n 's/.*"version"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p' web/package.json | head -n1)"
          base="${base:-0.0.0}"
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="${base}-dev.$(git rev-parse --short HEAD)"
          fi
          {
            echo "version=$version"
            echo "commit=$(git rev-parse --short HEAD)"
            echo "build_time=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            # ghcr.io only accepts lowercase paths but github.repository keeps its case
            # (owner "Alice" yields "Alice/jev"), which would point at a nonexistent repo
            # and get rejected at push time. Lowercase it.
            echo "image=ghcr.io/$(echo "${GITHUB_REPOSITORY}" | tr '[:upper:]' '[:lower:]')"
          } >> "$GITHUB_OUTPUT"
          echo "version=$version"

  build:
    needs: identity
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: linux,   goarch: amd64, ext: '',    archive: tar.gz }
          - { goos: linux,   goarch: arm64, ext: '',    archive: tar.gz }
          - { goos: windows, goarch: amd64, ext: '.exe', archive: zip }
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          VERSION: ${{ needs.identity.outputs.version }}
          COMMIT: ${{ needs.identity.outputs.commit }}
          BUILD_TIME: ${{ needs.identity.outputs.build_time }}
        run: |
          set -eux
          CGO_ENABLED=0 go build -trimpath \
            -ldflags="-s -w -X main.version=${VERSION} -X main.commit=${COMMIT} -X main.buildTime=${BUILD_TIME}" \
            -o "dist/jev-safety-gateway${{ matrix.ext }}" ./cmd/jev-safety-gateway

      - name: Package
        env:
          VERSION: ${{ needs.identity.outputs.version }}
        run: |
          set -eux
          pkg="jev-safety-gateway-${VERSION}-${{ matrix.goos }}-${{ matrix.goarch }}"
          mkdir -p "dist/${pkg}"
          mv "dist/jev-safety-gateway${{ matrix.ext }}" "dist/${pkg}/"

          # Ship the deployment doc inside the archive so the upgrade and backup notes
          # travel with the binary instead of having to be looked up in the repo.
          cp docs/deployment.md "dist/${pkg}/" 2>/dev/null || true

          if [ "${{ matrix.goos }}" = linux ]; then
            cp deploy/systemd/jev-safety-gateway.service "dist/${pkg}/"
            cp deploy/systemd/env.example "dist/${pkg}/"
            cp deploy/linux/install.sh "dist/${pkg}/"
            chmod +x "dist/${pkg}/install.sh"
          else
            cp scripts/install-service.ps1 "dist/${pkg}/"
            cp scripts/uninstall-service.ps1 "dist/${pkg}/"
            cp .env.example "dist/${pkg}/env.example"
          fi

          cd dist
          if [ "${{ matrix.archive }}" = zip ]; then
            zip -r "${pkg}.zip" "${pkg}"
          else
            tar czf "${pkg}.tar.gz" "${pkg}"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.goos }}-${{ matrix.goarch }}
          path: |
            dist/*.tar.gz
            dist/*.zip
          if-no-files-found: error

  image:
    needs: identity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ needs.identity.outputs.image }}
          tags: |
            type=raw,value=${{ needs.identity.outputs.version }}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=sha,prefix=sha-

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # .git is excluded from the build context, so the build identity inside the image
          # can only arrive this way; VERSION is passed explicitly so the Dockerfile does not
          # fall back to parsing web/package.json itself.
          build-args: |
            VERSION=${{ needs.identity.outputs.version }}
            COMMIT=${{ needs.identity.outputs.commit }}
            BUILD_TIME=${{ needs.identity.outputs.build_time }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    needs: [identity, build, image]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
          # Without name/pattern this means "download every artifact of the run". The image
          # job's docker/build-push-action also uploads a build record (DOCKER_BUILD_RECORD_UPLOAD
          # defaults to true, named <owner>~<repo>~<id>.dockerbuild): it is gzip, not zip, so
          # download-artifact cannot extract it and the whole step dies after 5 retries, taking
          # the three platform packages down with it. actions/toolkit#1874 is still unmerged,
          # so exclude it as the docker README advises.
          pattern: "!*.dockerbuild"

      - name: Create Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.identity.outputs.version }}
        run: |
          set -eux
          gh release create "v${VERSION}" \
            --repo "${{ github.repository }}" \
            --title "v${VERSION}" \
            --generate-notes \
            artifacts/*.tar.gz artifacts/*.zip
