acceptance:
  - id: A1
    source: brief.md
    text: 「最近请求」卡片提供判定状态、模型、关键词、时间范围四类筛选控件；改变任一控件后，列表以当前全部筛选条件（四者为「与」关系）重新向
      `/api/logs` 查询并重置到第 1 页。
    result: passed
    reason:
      text: "web/index.html 中 #log-filter/#log-range/#log-model/#log-q 四类控件齐备。实机
        Chrome 验证：在第 3 页修改判定状态后，请求变为 /api/logs?limit=50&offset=0&decision=block
        并回到第 1 页；随后依次追加 model、q、since，最终单一请求为
        /api/logs?limit=50&offset=0&decision=block&model=gpt-4o&q=192.168.1.&si\
        nce=...，结果数由 34 递减到 10，四者确为「与」关系。变更筛选重置首页由 reloadLogs() 置 logPage=0 保证。"
      truncated: false
  - id: A2
    source: brief.md
    text: 列表按服务端分页展示，每页固定 50 条；卡片显示「第 X / 共 Y 页」与总条数，并提供「上一页」「下一页」按钮翻页。
    result: passed
    reason:
      text: 服务端分页，LOG_PAGE_SIZE=50 恒定下发 limit=50。实机验证共 137 条时显示「第 1 / 共 3 页」「共 137
        条记录」，第 1、2 页各 50 行、第 3 页 37 行；「上一页」「下一页」按钮存在且可点击翻页（offset 依次为 0/50/100）。
      truncated: false
  - id: A3
    source: brief.md
    text: 位于第 1 页时「上一页」按钮禁用；位于最后一页时「下一页」按钮禁用。
    result: passed
    reason:
      text: renderPager() 以 logPage<=0 禁用「上一页」、logPage>=totalPages-1 禁用「下一页」。实机验证：第 1
        页 prev=disabled/next=enabled；第 2 页两者均可用；第 3 页
        prev=enabled/next=disabled。
      truncated: false
  - id: A4
    source: brief.md
    text: "`/api/logs` 接受 `limit`、`offset`、`decision`、`model`、`q`、`since` 参数并返回
      `{items, total}` 结构；用户可通过逐页翻阅浏览数据库中符合条件的全部历史日志，不再受原单次 200 行窗口限制。"
    result: passed
    reason:
      text: internal/admin/handler.go 的 /api/logs 解析
        limit/offset/decision/model/q/since 并调用 store.QueryLogs，返回
        {"items":...,"total":...}。直接 HTTP 实测：缺省返回 {items,total} 且按 id 倒序（首 137、末
        88）；offset=50 起始 id 87、offset=100 起始 id 37 并抵达最旧 id=1，137 条历史跨 3
        页全部可达，突破原 200 行窗口；decision 精确匹配（34 条全为 block）、model/q 为 LIKE
        子串（q=192.168.1.3 命中 7 条且 ip 全为该值）、since 为 ts 下界（1h 内 40 条）、total 不含
        limit/offset；limit=2000 回退 50、limit=1000 生效、offset 负数或非法按 0；参数全部参数化绑定，'
        OR 1=1 -- 与 x'; DROP TABLE logs;-- 均未生效，logs 表完好。
      truncated: false
  - id: A5
    source: brief.md
    text: 当前筛选条件无匹配记录时，列表显示「暂无记录」，「上一页」「下一页」均禁用，页码显示为第 1 / 共 1 页。
    result: passed
    reason:
      text: 无匹配时 tbody 渲染 colspan=11 的「暂无记录」，renderPager() 在 total=0 时
        totalPages=max(1,0)=1、logPage 归 0，故页码显示「第 1 / 共 1 页」且 prev/next 均
        disabled。实机验证 q=zzz-no-such-record-zzz 时如上显示，且点击「下一页」不发出任何请求（no-op）。
      truncated: false
  - id: A6
    source: brief.md
    text: 日志列表容器设有最大高度，当前页记录超出时容器内部纵向滚动、表头吸顶，页面整体不再被长列表撑开。
    result: passed
    reason:
      text: style.css 为 .logs-scroll 设 max-height:60vh; overflow-y:auto，.logs-scroll
        thead th 设 position:sticky; top:0 并带不透明底色 var(--panel)。实机测量：容器
        clientHeight=539、scrollHeight=1693 且可滚动（最大高度 538.8px），滚动 400px 后表头 th
        顶边仍为容器顶边 1078（吸附成立），表格主体首行随之上移，页面整体高度仅由 539px 的容器贡献而非 1693px 的表格。
      truncated: false
  - id: A7
    source: brief.md
    text: 现有能力不回退：判定状态筛选、时间列本地化显示、送检内容预览的 HTML 转义（防 XSS）保持有效。
    result: passed
    reason:
      text: 不回退：判定状态下拉仍驱动 decision 精确筛选并在行内显示「放行/拦截/跳过/错误」标签（block 查询 34
        条均显示「拦截」）；时间列仍为 new Date(l.ts).toLocaleString() 本地化（如 2026/9/22
        19:08:39）；escapeHtml 仍覆盖 path/kind/model/ip/reason/snippet 及 title
        属性。注入验证：库中写入 <script>alert("xss")</script><img src=x onerror=alert(1)>
        后，单元格 innerHTML 为 &lt;script&gt;... 实体转义、DOM 中无 script/img
        标签、window.alert 未被调用。
      truncated: false
  - id: A8
    source: brief.md
    text: 控制台正文与等宽字体改用优化后的系统字体栈（不引入 CDN 或内嵌字体文件），离线环境仍可用且保留兜底字体。
    result: passed
    reason:
      text: style.css 定义 --font-sans（Inter/Inter
        var/ui-sans-serif/system-ui/-apple-system/BlinkMacSystemFont/Segoe
        UI/PingFang SC/Hiragino Sans GB/Source Han Sans SC/Noto Sans CJK
        SC/Microsoft YaHei UI/Microsoft YaHei/sans-serif）与 --font-mono（JetBrains
        Mono/ui-monospace/SF Mono/Cascadia Code/Cascadia
        Mono/Menlo/Consolas/Liberation
        Mono/monospace），body、input/select/textarea、button、.mono
        均改用变量。实机计算样式确认生效且保留 sans-serif/monospace 兜底；页面仅 3
        个本地请求（/、style.css、app.js），无 @font-face、无 @import、无 CDN
        link，仓库内无字体文件，web/embed.go 仅嵌入三个静态资源，离线可用。
      truncated: false
  - id: A9
    source: brief.md
    text: "`go build -o gateway ./cmd/gateway` 与 `go vet ./...` 均通过。"
    result: passed
    reason:
      text: 本轮 Runtime 已对本候选冻结 go-build / go-vet 均通过；Verifier 独立复核：go build -o
        <临时目录>/gateway.exe ./cmd/gateway 构建成功（16.3M 二进制），go vet ./... 退出码 0、无告警。
      truncated: false
