<!DOCTYPE html>

<html lang="zh-CN"><head><meta charset="utf-8"/><meta content="width=device-width, initial-scale=1.0" name="viewport"/><meta content="web_blank" name="shell-type"/><link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet"/><link href="https://fonts.googleapis.com" rel="preconnect"/><link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/><link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&amp;family=Plus+Jakarta+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/><style>@layer base{html,body{margin:0;padding:0;}body{overscroll-behavior:none;}main>:first-child{margin-top:0!important;}main>:last-child{margin-bottom:0!important;}}::-webkit-scrollbar{display:none;}</style><script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script><script id="tailwind-config">tailwind.config = { darkMode: "class", theme: { extend: { "colors": { "surface": "#F5F5F7", "background": "#F5F5F7", "card-bg": "#FFFFFF", "text-primary": "#1D1D1F", "text-secondary": "#6E6E73", "text-tertiary": "#8E8E93", "apple-blue": "#007AFF", "apple-green": "#34C759", "apple-amber": "#FF9500", "apple-border": "#E5E5EA", "apple-input-bg": "#F5F5F7" }, "borderRadius": { "card": "1.5rem", "DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "2xl": "1rem", "full": "9999px" }, "fontFamily": { "body": [ "Plus Jakarta Sans", "system-ui", "-apple-system", "sans-serif" ], "code": [ "JetBrains Mono", "monospace" ] } } } };</script></head><body class="bg-gradient-to-b from-[#F5F5F7] via-[#F8F8FA] to-[#EBEBF0] min-h-screen font-body text-text-primary antialiased selection:bg-apple-blue selection:text-white"><main class="min-h-screen w-full flex items-center justify-center p-4 sm:p-6"><div class="flex flex-col w-full items-center justify-center relative min-h-0 py-8">
<!-- Subtle ambient glow matching Apple lighting -->
<div class="absolute w-[500px] h-[500px] rounded-full bg-apple-blue/[0.04] blur-3xl pointer-events-none -top-24 -left-20"></div>
<div class="absolute w-[440px] h-[440px] rounded-full bg-[#5856D6]/[0.03] blur-3xl pointer-events-none -bottom-20 -right-20"></div>
<!-- Top Utilities Bar: Segmented Controls for Language & Mode -->
<div class="w-full max-w-[440px] flex items-center justify-between mb-4 px-1 z-10">
<div class="flex items-center gap-1.5 text-text-secondary">
<span class="material-symbols-outlined text-[17px] text-[#6E6E73]">verified_user</span>
<span class="font-code text-[11px] tracking-wide uppercase font-medium text-text-secondary">v2.4.1-rc3</span>
</div>
<div class="flex items-center gap-2">
<!-- Language Pill -->
<div class="flex items-center bg-black/[0.05] p-0.5 rounded-full border border-black/[0.04] backdrop-blur-md">
<button class="text-[11px] font-semibold px-2.5 py-0.5 rounded-full transition-all duration-200 bg-white text-text-primary shadow-sm" id="langZh" onclick="switchLang('zh')" type="button">中文</button>
<button class="text-[11px] font-medium px-2.5 py-0.5 rounded-full transition-all duration-200 text-text-secondary hover:text-text-primary" id="langEn" onclick="switchLang('en')" type="button">EN</button>
</div>
<!-- Mode Pill (Toggle Setup / Login Preview) -->
<div class="flex items-center bg-black/[0.05] p-0.5 rounded-full border border-black/[0.04] backdrop-blur-md">
<button class="text-[11px] font-semibold px-2.5 py-0.5 rounded-full transition-all duration-200 bg-white text-text-primary shadow-sm flex items-center gap-1" id="tabLogin" onclick="setAuthMode('login')" type="button">
<span class="material-symbols-outlined text-[13px]">login</span>
<span id="tabLoginText">验证登录</span>
</button>
<button class="text-[11px] font-medium px-2.5 py-0.5 rounded-full transition-all duration-200 text-text-secondary hover:text-text-primary flex items-center gap-1" id="tabSetup" onclick="setAuthMode('setup')" type="button">
<span class="material-symbols-outlined text-[13px]">key</span>
<span id="tabSetupText">初始配置</span>
</button>
</div>
</div>
</div>
<!-- Primary Cupertino Auth Card (Apple Light Elevation) -->
<div class="w-full max-w-[440px] bg-white rounded-[24px] border border-apple-border shadow-[0_12px_36px_rgba(0,0,0,0.08)] p-6 sm:p-8 flex flex-col items-center relative z-10 transition-all duration-300">
<!-- App Icon & Ambient Rim Glow -->
<div class="relative mb-4 group">
<div class="absolute -inset-1.5 rounded-[22px] bg-gradient-to-b from-apple-blue/30 to-[#5856D6]/20 opacity-70 blur-md group-hover:opacity-90 transition duration-500"></div>
<div class="relative w-20 h-20 rounded-[20px] overflow-hidden shadow-[0_8px_20px_rgba(0,122,255,0.25)] flex items-center justify-center bg-white">
<img alt="JEV Security Gateway Shield Icon" class="w-full h-full object-cover" src="https://lh3.googleusercontent.com/aida/AEtjO1UvtmeREJOva_7eYrijNEhkk3MIiqexHJCJ7f1jwJ0kO7Tml2Xi8redyseI80sYItDe1Sl9OFbNbttMYsTevaBrvrd642EEVqFZPKgIju9GIG0WfN64OJlmUAjQmwzTOrP_2JvSbk1wcK6pm0JDFJMhiVfMNG3WoxvW4mrQTZ0xLsK54MXyDLDWLuPn4GSGUqdn-fuU9wYeIWhqbtK40a34G5wRQuB2tNV53k4Vu7skphn1leEV3Me7UPA"/>
</div>
</div>
<!-- Title & Subtitle Hierarchy -->
<div class="text-center mb-5">
<h1 class="text-[22px] sm:text-[24px] font-bold text-text-primary tracking-tight" id="mainTitle">JEV 安全网关</h1>
<p class="text-[13px] text-text-secondary mt-1 font-normal tracking-normal" id="subTitle">AI Request Security &amp; Filtering Gateway</p>
</div>
<!-- Dynamic Status Banner Pill -->
<div class="w-full mb-5 py-2 px-3 rounded-xl flex items-center justify-center gap-1.5 bg-[#007AFF]/10 text-apple-blue border border-[#007AFF]/15 transition-colors duration-200" id="statusPill">
<span class="material-symbols-outlined text-[16px]" id="statusIcon">lock</span>
<span class="text-[12px] font-medium tracking-tight text-center" id="statusText">输入管理员口令以访问控制台</span>
</div>
<!-- Authentication Form -->
<form class="w-full flex flex-col gap-4" onsubmit="event.preventDefault(); handleAuthSubmit();">
<!-- Password Input Row -->
<div class="flex flex-col gap-1.5">
<div class="flex justify-between items-center px-0.5">
<label class="text-[12px] text-text-secondary font-medium" for="adminPass" id="labelPass">管理员主口令</label>
<span class="font-code text-[11px] text-text-tertiary" id="passMeta">SHA-256 Auth</span>
</div>
<div class="relative flex items-center rounded-xl bg-apple-input-bg border border-apple-border transition-all focus-within:border-apple-blue focus-within:bg-white focus-within:ring-2 focus-within:ring-apple-blue/20">
<span class="material-symbols-outlined text-text-tertiary absolute left-3 text-[19px] pointer-events-none">shield_locked</span>
<input autocomplete="current-password" class="w-full bg-transparent pl-10 pr-10 py-2.5 text-[15px] text-text-primary placeholder:text-text-tertiary focus:outline-none border-none ring-0 focus:ring-0" id="adminPass" placeholder="••••••••" required="" type="password"/>
<button class="absolute right-2.5 text-text-tertiary hover:text-text-primary transition-colors p-1 flex items-center justify-center" onclick="togglePasswordVisibility('adminPass', 'passEyeIcon')" tabindex="-1" title="Toggle visibility" type="button">
<span class="material-symbols-outlined text-[18px]" id="passEyeIcon">visibility_off</span>
</button>
</div>
</div>
<!-- Confirm Password Row (Conditional via Setup Mode) -->
<div class="hidden flex-col gap-1.5" id="confirmPassContainer">
<div class="flex justify-between items-center px-0.5">
<label class="text-[12px] text-text-secondary font-medium" for="confirmPass" id="labelConfirm">重复确认新口令</label>
<span class="font-code text-[11px] text-apple-amber font-medium">至少6位字符</span>
</div>
<div class="relative flex items-center rounded-xl bg-apple-input-bg border border-apple-border transition-all focus-within:border-apple-blue focus-within:bg-white focus-within:ring-2 focus-within:ring-apple-blue/20">
<span class="material-symbols-outlined text-text-tertiary absolute left-3 text-[19px] pointer-events-none">pin</span>
<input autocomplete="new-password" class="w-full bg-transparent pl-10 pr-10 py-2.5 text-[15px] text-text-primary placeholder:text-text-tertiary focus:outline-none border-none ring-0 focus:ring-0" id="confirmPass" placeholder="••••••••" type="password"/>
<button class="absolute right-2.5 text-text-tertiary hover:text-text-primary transition-colors p-1 flex items-center justify-center" onclick="togglePasswordVisibility('confirmPass', 'confirmEyeIcon')" tabindex="-1" title="Toggle visibility" type="button">
<span class="material-symbols-outlined text-[18px]" id="confirmEyeIcon">visibility_off</span>
</button>
</div>
</div>
<!-- Security Option Checkbox / Quick Toggle -->
<div class="flex items-center justify-between px-0.5 pt-0.5">
<label class="flex items-center gap-2 cursor-pointer select-none">
<input checked="" class="accent-apple-blue w-4 h-4 rounded border-apple-border text-apple-blue focus:ring-apple-blue/30 cursor-pointer" id="rememberSession" type="checkbox"/>
<span class="text-[12px] text-text-secondary" id="labelRemember">保持本工作站受信任凭据 (24h)</span>
</label>
<button class="text-[12px] text-apple-blue font-medium hover:underline transition-colors" id="labelResetHelp" onclick="triggerHelpSheet()" type="button">重置安全凭据?</button>
</div>
<!-- Action Button (Apple System Blue) -->
<button class="w-full mt-1 bg-apple-blue hover:bg-[#0071E3] active:scale-[0.985] text-white text-[15px] font-semibold py-2.5 px-4 rounded-xl shadow-[0_4px_12px_rgba(0,122,255,0.28)] transition-all duration-150 flex items-center justify-center gap-1.5" id="submitBtn" type="submit">
<span id="submitBtnText">登录控制台</span>
<span class="material-symbols-outlined text-[19px]">arrow_forward</span>
</button>
</form>
<!-- System Daemon Health Pill (Telemetry Feed) -->
<div class="w-full mt-6 pt-4 border-t border-apple-border/70 flex flex-col items-center gap-3">
<div class="flex items-center gap-2 px-3 py-1 rounded-full bg-black/[0.04] border border-black/[0.03] text-text-primary">
<span class="w-2 h-2 rounded-full bg-apple-green shadow-[0_0_8px_rgba(52,199,89,0.8)] animate-pulse"></span>
<span class="font-code text-[11px] tracking-tight text-text-secondary">
<span id="daemonLabel">守护进程活跃</span> · <span class="text-text-primary font-semibold">127.0.0.1:8080</span>
</span>
</div>
<!-- Inset Security Badges -->
<div class="w-full flex items-center justify-between text-text-tertiary font-code text-[10px]">
<span class="flex items-center gap-1">
<span class="material-symbols-outlined text-[13px] text-apple-green">memory</span>
LATENCY &lt;1.8ms
</span>
<span class="flex items-center gap-1">
<span class="material-symbols-outlined text-[13px] text-apple-blue">encrypted</span>
ZERO-TRUST TLS
</span>
<span class="flex items-center gap-1">
<span class="material-symbols-outlined text-[13px] text-apple-amber">rule</span>
PII SHIELD ACTIVE
</span>
</div>
</div>
<!-- Apple-style Footer Signature -->
<div class="mt-4 text-center text-[11px] text-text-tertiary">
Typesafe AI / JEV Core Protected
</div>
</div>
<!-- Notification Toast Modal (Hidden by Default) -->
<div class="hidden fixed bottom-8 z-50 bg-white/95 backdrop-blur-xl border border-apple-border text-text-primary text-[14px] font-medium px-5 py-2.5 rounded-full shadow-[0_12px_28px_rgba(0,0,0,0.12)] items-center gap-2 transition-all" id="toastMessage">
<span class="material-symbols-outlined text-apple-green text-[18px]" id="toastIcon">check_circle</span>
<span id="toastText">操作成功</span>
</div>
</div>
<script>
  let currentLang = 'zh';
  let currentMode = 'login';

  const strings = {
    zh: {
      title: 'JEV 安全网关',
      subtitle: 'AI Request Security & Filtering Gateway',
      loginStatus: '输入管理员口令以访问控制台',
      setupStatus: '首次使用：请设置管理员口令（至少6位）',
      labelPass: '管理员主口令',
      labelConfirm: '重复确认新口令',
      passMeta: 'SHA-256 Auth',
      passMetaSetup: '高强度加密',
      remember: '保持本工作站受信任凭据 (24h)',
      resetHelp: '重置安全凭据?',
      submitLogin: '登录控制台',
      submitSetup: '完成设置并进入',
      tabLogin: '验证登录',
      tabSetup: '初始配置',
      daemon: '守护进程活跃',
      pwdLengthErr: '口令长度须大于或等于6位',
      pwdMismatch: '两次输入的口令不一致',
      loginSuccess: '验证通过，正在载入安全控制台...',
      setupSuccess: '网关密钥已初始化并激活！',
      copiedHelp: '系统救援模式：已向系统日志打印物理重置密钥指南'
    },
    en: {
      title: 'JEV Security Gateway',
      subtitle: 'AI Request Security & Filtering Gateway',
      loginStatus: 'Enter master credentials to access console',
      setupStatus: 'Initial Setup: Configure root passcode (min 6 chars)',
      labelPass: 'Master Passcode',
      labelConfirm: 'Confirm Passcode',
      passMeta: 'SHA-256 Auth',
      passMetaSetup: 'Argon2id Enforced',
      remember: 'Keep workstation trusted (24h)',
      resetHelp: 'Credential recovery?',
      submitLogin: 'Authenticate & Enter',
      submitSetup: 'Complete Setup & Launch',
      tabLogin: 'Sign In',
      tabSetup: 'Provision',
      daemon: 'Daemon Active',
      pwdLengthErr: 'Passcode must be at least 6 characters',
      pwdMismatch: 'Passcodes do not match',
      loginSuccess: 'Access authorized, dispatching telemetry...',
      setupSuccess: 'Gateway master key initialized successfully!',
      copiedHelp: 'Rescue Mode: Physical reset instructions emitted to console daemon'
    }
  };

  function setAuthMode(mode) {
    currentMode = mode;
    const confirmBox = document.getElementById('confirmPassContainer');
    const statusPill = document.getElementById('statusPill');
    const statusText = document.getElementById('statusText');
    const statusIcon = document.getElementById('statusIcon');
    const submitBtnText = document.getElementById('submitBtnText');
    const passMeta = document.getElementById('passMeta');

    const tabLogin = document.getElementById('tabLogin');
    const tabSetup = document.getElementById('tabSetup');

    if (mode === 'setup') {
      confirmBox.classList.remove('hidden');
      confirmBox.classList.add('flex');
      statusPill.className = 'w-full mb-5 py-2 px-3 rounded-xl flex items-center justify-center gap-1.5 bg-[#FF9500]/10 text-apple-amber border border-[#FF9500]/20 transition-colors duration-200';
      statusIcon.textContent = 'app_registration';
      statusText.textContent = strings[currentLang].setupStatus;
      submitBtnText.textContent = strings[currentLang].submitSetup;
      passMeta.textContent = strings[currentLang].passMetaSetup;

      tabSetup.className = 'text-[11px] font-semibold px-2.5 py-0.5 rounded-full transition-all duration-200 bg-white text-text-primary shadow-sm flex items-center gap-1';
      tabLogin.className = 'text-[11px] font-medium px-2.5 py-0.5 rounded-full transition-all duration-200 text-text-secondary hover:text-text-primary flex items-center gap-1';
    } else {
      confirmBox.classList.add('hidden');
      confirmBox.classList.remove('flex');
      statusPill.className = 'w-full mb-5 py-2 px-3 rounded-xl flex items-center justify-center gap-1.5 bg-[#007AFF]/10 text-apple-blue border border-[#007AFF]/15 transition-colors duration-200';
      statusIcon.textContent = 'lock';
      statusText.textContent = strings[currentLang].loginStatus;
      submitBtnText.textContent = strings[currentLang].submitLogin;
      passMeta.textContent = strings[currentLang].passMeta;

      tabLogin.className = 'text-[11px] font-semibold px-2.5 py-0.5 rounded-full transition-all duration-200 bg-white text-text-primary shadow-sm flex items-center gap-1';
      tabSetup.className = 'text-[11px] font-medium px-2.5 py-0.5 rounded-full transition-all duration-200 text-text-secondary hover:text-text-primary flex items-center gap-1';
    }
  }

  function switchLang(lang) {
    currentLang = lang;
    const l = strings[lang];
    document.getElementById('mainTitle').textContent = l.title;
    document.getElementById('subTitle').textContent = l.subtitle;
    document.getElementById('labelPass').textContent = l.labelPass;
    document.getElementById('labelConfirm').textContent = l.labelConfirm;
    document.getElementById('labelRemember').textContent = l.remember;
    document.getElementById('labelResetHelp').textContent = l.resetHelp;
    document.getElementById('tabLoginText').textContent = l.tabLogin;
    document.getElementById('tabSetupText').textContent = l.tabSetup;
    document.getElementById('daemonLabel').textContent = l.daemon;

    // Refresh mode strings
    setAuthMode(currentMode);

    const btnZh = document.getElementById('langZh');
    const btnEn = document.getElementById('langEn');
    if (lang === 'zh') {
      btnZh.className = 'text-[11px] font-semibold px-2.5 py-0.5 rounded-full transition-all duration-200 bg-white text-text-primary shadow-sm';
      btnEn.className = 'text-[11px] font-medium px-2.5 py-0.5 rounded-full transition-all duration-200 text-text-secondary hover:text-text-primary';
    } else {
      btnEn.className = 'text-[11px] font-semibold px-2.5 py-0.5 rounded-full transition-all duration-200 bg-white text-text-primary shadow-sm';
      btnZh.className = 'text-[11px] font-medium px-2.5 py-0.5 rounded-full transition-all duration-200 text-text-secondary hover:text-text-primary';
    }
  }

  function togglePasswordVisibility(inputId, iconId) {
    const input = document.getElementById(inputId);
    const icon = document.getElementById(iconId);
    if (!input || !icon) return;

    if (input.type === 'password') {
      input.type = 'text';
      icon.textContent = 'visibility';
    } else {
      input.type = 'password';
      icon.textContent = 'visibility_off';
    }
  }

  function showToast(msg, isError = false) {
    const toast = document.getElementById('toastMessage');
    const toastText = document.getElementById('toastText');
    const toastIcon = document.getElementById('toastIcon');

    toastText.textContent = msg;
    if (isError) {
      toastIcon.textContent = 'error';
      toastIcon.className = 'material-symbols-outlined text-[#FF3B30] text-[18px]';
    } else {
      toastIcon.textContent = 'check_circle';
      toastIcon.className = 'material-symbols-outlined text-apple-green text-[18px]';
    }

    toast.classList.remove('hidden');
    toast.classList.add('flex');

    setTimeout(() => {
      toast.classList.add('hidden');
      toast.classList.remove('flex');
    }, 2800);
  }

  function handleAuthSubmit() {
    const pass = document.getElementById('adminPass').value;
    const l = strings[currentLang];

    if (!pass || pass.length < 6) {
      showToast(l.pwdLengthErr, true);
      return;
    }

    if (currentMode === 'setup') {
      const confirm = document.getElementById('confirmPass').value;
      if (pass !== confirm) {
        showToast(l.pwdMismatch, true);
        return;
      }
      showToast(l.setupSuccess, false);
      setTimeout(() => setAuthMode('login'), 1200);
    } else {
      showToast(l.loginSuccess, false);
    }
  }

  function triggerHelpSheet() {
    showToast(strings[currentLang].copiedHelp, false);
  }
</script></main></body></html>
