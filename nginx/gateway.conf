# 示例 nginx 配置：客户端 → nginx → JEV 网关 → 上游
#
# 客户端把请求打到 nginx，nginx 反代到网关的 8080 端口。网关完成安全过滤后，
# 再由网关自身转发到上游 (upstream_base_url，在控制台配置)。

upstream jev_gateway {
    server jev-gateway:8080;   # docker-compose 服务名；裸机部署改为 127.0.0.1:8080
    keepalive 32;
}

server {
    listen 80;
    server_name _;

    # 大模型响应可能较大 / 流式，关闭缓冲、放宽超时与包体限制。
    client_max_body_size 32m;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_read_timeout 600s;
    proxy_send_timeout 600s;

    # 透传真实来源，网关据此记录来源 IP。
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    location / {
        proxy_pass http://jev_gateway;
    }
}

