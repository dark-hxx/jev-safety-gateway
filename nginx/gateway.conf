# 示例 nginx 配置：客户端 → nginx → JEV 网关 → 上游
#
# 客户端把请求打到 nginx，nginx 反代到网关的 8080 端口。网关完成安全过滤后，
# 再由网关自身转发到上游 (upstream_base_url，在控制台配置)。
#
# 安装：cp nginx/gateway.conf /etc/nginx/conf.d/ && nginx -s reload
#
# 只改一处：下面的 upstream 地址。默认 127.0.0.1:8080 对应裸机部署。
# 若 nginx 与网关都在 docker-compose 里，改成服务名 jev-safety-gateway:8080，
# 并确保两者在同一 docker 网络（compose 默认就在同一网络）。
#
# 本文件还承担「公网加固」：网关是给 LLM 客户端用的纯 API 入口，没有任何网页，
# 所以扫描器猜的路径全部可以直接掐掉。两层分工见下面的注释。

upstream jev_safety_gateway {
    server 127.0.0.1:8080;   # 容器部署改为：server jev-safety-gateway:8080;
    keepalive 32;
}

# 单 IP 限速：正常 LLM 客户端是「偶尔一次、每次较慢」的节奏，30r/s 已经很宽；
# 扫端口/刷接口的流量会立刻撞上限。
limit_req_zone $binary_remote_addr zone=jev:10m rate=30r/s;

server {
    listen 80;
    server_name _;

    # 不回版本号，少给扫描器一点指纹。
    server_tokens off;

    # 大模型响应可能较大 / 流式，关闭缓冲、放宽超时与包体限制。
    client_max_body_size 32m;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_read_timeout 600s;
    proxy_send_timeout 600s;

    # 透传真实来源，网关据此记录来源 IP。少了这两个头，网关看到的来源 IP
    # 全是 nginx 的地址，按 IP 的滥用封禁会把所有客户端算成同一个来源。
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;

    # 覆盖，而不是追加（$proxy_add_x_forwarded_for 是追加）。网关取的是
    # X-Forwarded-For 的第一段，而追加会把客户端自带的头拼在最前面——那样客户端
    # 可以自称任意 IP，既能绕过封禁，也能借封禁规则去封掉别人的 IP。
    # 覆盖之后第一段恒为真实来源。
    #
    # 前提：网关只能经这一层访问（docker-compose 已把 8080 绑到 127.0.0.1）。
    # 若 nginx 前面还有 CDN/其他代理，这里要改成信任链的写法，否则拿到的是上一跳的地址。
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;

    # ---- 扫描特征拦截（默认启用，与控制台的配置互不耦合）----
    #
    # 这一层只做「明显不是 LLM 接口」的粗拦截，返回 444：不回任何响应直接关连接，
    # 扫描器拿不到状态码、拿不到 banner，成本也最低——不进网关进程、不写审计行。
    # 审计日志走的是单连接 SQLite，扫描洪峰本来会占住那唯一的连接、拖慢真实流量。
    #
    # 白名单那一层留给网关自己（控制台可配的「路径前缀白名单」），这样两处清单
    # 不需要同步维护。若你要更严的 nginx 白名单，见文件末尾的注释块。

    # 隐藏路径段：/.env、/.git/config、/.svn/…（要求「斜杠+点」，所以
    # /v1/files/a.jpg 这类正常带扩展名的接口路径不受影响）
    location ~ /\. {
        return 444;
    }

    # 脚本与配置/密钥文件探测。
    location ~* \.(php|asp|aspx|jsp|cgi|env|git|svn|hg|bak|orig|swp|sql|sqlite|ini|conf|pem|key|p12|pfx)$ {
        return 444;
    }

    # 常见后台/中间件探测路径。
    location ~* /(wp-admin|wp-login|wp-content|wp-includes|xmlrpc|phpmyadmin|phpinfo|adminer|druid|actuator|jenkins|solr|hnap1|cgi-bin)/? {
        return 444;
    }

    # 根路径没有页面可给。若你的客户端确实会探 GET /，删掉这一条。
    location = / {
        return 444;
    }

    # ---- 正常入口 ----

    # 健康检查：网关自己处理，不转发到上游。
    location = /healthz {
        proxy_pass http://jev_safety_gateway;
    }

    location / {
        limit_req zone=jev burst=60 nodelay;
        proxy_pass http://jev_safety_gateway;
    }

    # ---- 可选：把上面改成严格白名单 ----
    #
    # 只有确认接口前缀固定不变时才启用。⚠️ 这里的前缀清单必须始终是控制台
    # 「设置 → 安全防护 → 路径前缀白名单」的超集：控制台里加了前缀而这里没有，
    # 请求会在 nginx 就被 444，根本到不了网关，控制台那边看起来毫无反应。
    # 两边不一致是这套配置最容易踩的坑，所以默认不启用。
    #
    # location = /healthz { proxy_pass http://jev_safety_gateway; }
    # location ~ ^/(v1|v1beta)/ {
    #     limit_req zone=jev burst=60 nodelay;
    #     proxy_pass http://jev_safety_gateway;
    # }
    # location / { return 444; }
}

