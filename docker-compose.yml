services:
  jev-safety-gateway:
    build:
      context: .
      # VERSION 留空时由 Dockerfile 从 web/package.json 自行解析，所以默认的
      # `docker compose up -d --build` 也会报出真实版本号而不是 "dev"。
      # .git 不在构建上下文里，COMMIT/BUILD_TIME 拿不到，只能这样传进来：
      #   JEV_COMMIT=$(git rev-parse --short HEAD) docker compose up -d --build
      args:
        VERSION: "${JEV_VERSION:-}"
        COMMIT: "${JEV_COMMIT:-}"
        BUILD_TIME: "${JEV_BUILD_TIME:-}"
    image: jev-safety-gateway:latest
    container_name: jev-safety-gateway
    restart: unless-stopped
    ports:
      # 只绑本机：公网流量必须先过 nginx（见 nginx/gateway.conf）。直接发布到
      # 公网会让扫描器绕过 nginx 的全部规则，也会让客户端可以伪造
      # X-Forwarded-For 自称任意 IP（既能绕过封禁，也能借封禁规则封掉别人）。
      # 容器内仍监听所有网卡，所以 compose 里的 nginx 用服务名照常可达。
      - "127.0.0.1:8080:8080"   # 过滤代理 (nginx 转发到这里)
      - "127.0.0.1:8081:8081"  # 管理控制台 (默认仅本机, 生产建议置于内网/加认证)
    environment:
      # 首次启动可通过环境变量做一次性初始化 (已存在的值不会被覆盖):
      JEV_UPSTREAM_URL: "${JEV_UPSTREAM_URL:-}"      # 上游, 如 http://newapi:3000
      JEV_BASE_URL: "${JEV_BASE_URL:-https://api.typesafe.ai}"
      JEV_API_KEY: "${JEV_API_KEY:-}"                # 初始 JEV 密钥 (可选)
      JEV_ADMIN_PASSWORD: "${JEV_ADMIN_PASSWORD:-}"  # 初始管理员口令 (可选)
      # 可选 GeoIP 归属 (IP 风险分析页的国家/ASN 排行): 每次启动读取, 非一次性初始化。
      # 默认值就是容器内路径, 与下方 ./geoip:/geoip:ro 挂载配套——把两个 .mmdb 放进 ./geoip/
      # 即生效, 不用改这里; 文件不存在或目录为空 = 该维度关闭, 面板保持未接入。
      JEV_GEOIP_COUNTRY_DB: "${JEV_GEOIP_COUNTRY_DB:-/geoip/GeoLite2-Country.mmdb}"
      JEV_GEOIP_ASN_DB: "${JEV_GEOIP_ASN_DB:-/geoip/GeoLite2-ASN.mmdb}"
      # 可选: 本网关部署坐标 (十进制度), 只用于来源图中心节点 (各来源向其汇聚)。
      # 网关自身出口 IP 离线不可知, 只能由部署方声明; 两个都要给且范围合法才算数,
      # 否则等同于没配 (图里只画来源标点, 不画中心节点与弧线)。
      JEV_GATEWAY_LAT: "${JEV_GATEWAY_LAT:-}"            # 如 31.23
      JEV_GATEWAY_LON: "${JEV_GATEWAY_LON:-}"            # 如 121.47
    volumes:
      # 数据库落在仓库的 ./data/ 下 (绑定挂载, 宿主随时可看、可备份、可直接检查)。
      # 容器以非 root 的 uid 10001 运行, 而绑定挂载用的是宿主目录的属主 (具名卷会由镜像
      # 初始化属主, 绑定挂载不会), 所以 Linux 上先建目录并改属主, 否则容器起不来
      # (日志会报 open store: ... permission denied 并反复重启):
      #   mkdir -p ./data && sudo chown -R 10001:10001 ./data
      # .db / -wal / -shm 三件套都在这里, 数据主要落在 WAL 里——必须整体保护,
      # 不要单独删或单独拷贝某一个文件。
      - ./data:/data
      # GeoIP 库: 把从 MaxMind 下载的 GeoLite2-Country.mmdb / GeoLite2-ASN.mmdb 放进 ./geoip/
      # 即生效 (上面两个 env 已默认指向容器内 /geoip/...)。只读挂载, 目录为空则该维度关闭。
      # 只需可读, 不用改属主。GeoLite2 不随镜像捆绑 (许可 + 离线约束), 需自备;
      # .mmdb 已加入 .gitignore 与 .dockerignore。
      - ./geoip:/geoip:ro
    # 容器日志默认无限增长，长期运行必须设上限。
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    # 若 newapi 也在本 compose 中, 可用 depends_on 并以服务名互联:
    # depends_on:
    #   - newapi

  # 示例: 将 nginx 作为最前端入口 (可选, 按需启用)
  # 注意 nginx/gateway.conf 的 upstream 默认写的是 127.0.0.1:8080（裸机口径），
  # 在容器里要改成服务名 jev-safety-gateway:8080 才能解析。
  # nginx:
  #   image: nginx:alpine
  #   ports:
  #     - "80:80"
  #   volumes:
  #     - ./nginx/gateway.conf:/etc/nginx/conf.d/default.conf:ro
  #   depends_on:
  #     - jev-safety-gateway
